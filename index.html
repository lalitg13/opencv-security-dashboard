<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCV Live Security Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            margin-bottom: 5px;
            font-size: 1.8rem;
        }
        p {
            color: #94a3b8;
            margin-bottom: 25px;
        }
        .stream-container {
            border: 3px solid #334155;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
            background-color: #1e293b;
        }
        img {
            display: block;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>🛡️ OpenCV Live Security Dashboard</h1>
    <p>Streaming securely from your macOS development server</p>
    
    <div class="stream-container">
        <!-- The image source points directly to our Flask streaming endpoint -->
        <img src="{{ url_for('video_feed') }}" alt="Live Video Feed">
    </div>
</body>
</html>
